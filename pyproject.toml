[project]
name = "borehole-geometry-ml"
version = "0.1.0"
description = "Estimating well-to-well and multilateral-leg production interference from 3-D drilling geometry (PyTorch)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Bryan Hughes" }]
dependencies = [
    "duckdb>=1.1",        # reads the shapefiles/CSVs directly (spatial ext) — no GDAL/geopandas needed
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",        # parquet intermediates
    "scikit-learn>=1.5",  # baselines the neural model must beat
    "torch>=2.4",         # the set-encoder (Phase 8)
    "matplotlib>=3.9",    # report figures
    "requests>=2.32",     # scripts/fetch_data.py
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/borehole_geometry"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F", "B", "I"]  # pyflakes, bugbear, import-sort

[tool.pytest.ini_options]
testpaths = ["tests"]
